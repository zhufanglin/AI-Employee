# =============================================================================
# fcmediaagent-ratelimit-locations.conf —— nginx 限流：server{} 上下文部分
# =============================================================================
# 【放在哪里】本文件只能被 include 到站点 server{} 内（不能放 http{}），例如在
# /etc/nginx/sites-available/fcmediaagent 的 443 server{} 中加一行：
#   include /etc/nginx/snippets/fcmediaagent-ratelimit-locations.conf;
#
# 【依赖】必须先按 fcmediaagent-ratelimit.conf 在 http{} 中定义
# fcm_auth / fcm_api 两个 zone 和 fcm_backend upstream，否则 nginx -t 会报
# "unknown limit_req zone" / "unknown upstream"。
#
# 【location 优先级】三个认证 location 用 ^~ 前缀，比 /api/ 更长，会优先匹配；
# ^~ 同时阻止后续正则 location 抢走请求。其余 /api/ 落到最后一个 location。
#
# 【重要】如果生产站点里已经有同名 location（尤其是 location /api/），
# 不要重复定义；把本文件里对应的 limit_req / limit_req_status 两行合并进
# 原 location 即可，proxy_pass 等代理参数沿用原配置。重复 location 会导致
# nginx -t 报 "duplicate location"。
#
# 【SSE】沿用生产站点关闭 proxy_buffering 的做法，避免流式响应被缓冲。
# =============================================================================

# ---- 登录 / 短信 / 注册：5r/m，burst=5 ----
location ^~ /api/auth/sms {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://fcm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /api/auth/login {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://fcm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /api/auth/register {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://fcm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- 其余 API：30r/s，burst=30 ----
# 如果生产站点已有 location /api/，只需把下面两行 limit_req 合并进去。
location ^~ /api/ {
    limit_req zone=fcm_api burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://fcm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
