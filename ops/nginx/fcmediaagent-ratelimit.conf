# =============================================================================
# fcmediaagent-ratelimit.conf —— nginx 限流：http{} 上下文部分
# =============================================================================
# 【放在哪里】本文件只能被 include 到 nginx 的 http{} 上下文，例如：
#   /etc/nginx/conf.d/fcmediaagent-ratelimit.conf
# Ubuntu 的 nginx.conf 默认在 http{} 内 include /etc/nginx/conf.d/*.conf，
# 所以把本文件放到 /etc/nginx/conf.d/ 即可，不需要改 nginx.conf。
#
# 【不能放哪里】limit_req_zone 是 http 级指令，不能写在 server{} / location{}
# 里；如果把它放进站点文件会报 "limit_req_zone directive is not allowed here"。
#
# 【配套文件】server{} 上下文（location + limit_req）见同目录：
#   fcmediaagent-ratelimit-locations.conf
# 两个文件必须一起下发；只放本文件不会产生任何限流效果。
#
# 【限流策略】
#   fcm_auth：登录 / 短信 / 注册，按来源 IP 5 次/分钟，burst=5（允许突发 5 个），
#             nodelay（突发额度立即放行，不排队拖慢响应）。
#   fcm_api ：其余 /api/ 接口，按来源 IP 30 次/秒，burst=30，nodelay。
# 说明：5r/m 对正常用户足够（一分钟内不可能手动点 5 次登录/发短信）；
#       如果办公网/运营商 NAT 后面大量用户共用一个出口 IP，可把 fcm_auth
#       调到 10r/m 或把 burst 调到 10，改动后 nginx -t && systemctl reload nginx。
#
# 【注意】本文件中的 upstream 名称 fcm_backend 与 locations 文件配套使用。
# 如果生产站点已经定义了 upstream / 使用别的名字，请同步修改 locations 文件
# 里的 proxy_pass，避免重复定义 upstream 或指向不存在的后端。
# =============================================================================

# 认证类接口：5 次/分钟（登录、短信发送/校验、注册）
limit_req_zone $binary_remote_addr zone=fcm_auth:10m rate=5r/m;

# 其余 API：30 次/秒
limit_req_zone $binary_remote_addr zone=fcm_api:20m rate=30r/s;

# 触发限流时记 warn 日志（默认 error），便于观察是否误伤正常用户
limit_req_log_level warn;

# 后端地址。生产 API 只监听 127.0.0.1:3000。
# 若站点已有 upstream 定义，可删除本段并复用原 upstream 名称。
upstream fcm_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}
