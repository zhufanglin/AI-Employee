server {
  server_name ai.fcmediaagent.com api.fcmediaagent.com;
  client_max_body_size 220m;

  # P49 限流：短信/登录/注册 5 次/分钟（burst 5，超出 429）
  location /api/auth/sms/ {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/fcm-proxy.conf;
  }
  location = /api/auth/login {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/fcm-proxy.conf;
  }
  location = /api/auth/register {
    limit_req zone=fcm_auth burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/fcm-proxy.conf;
  }

  location / {
    limit_req zone=fcm_api burst=30 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/fcm-proxy.conf;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai.fcmediaagent.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.fcmediaagent.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = api.fcmediaagent.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ai.fcmediaagent.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name ai.fcmediaagent.com api.fcmediaagent.com;
    return 404; # managed by Certbot




}
